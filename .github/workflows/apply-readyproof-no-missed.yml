name: Apply ReadyProof no-missed patch

on:
  push:
    branches:
      - chatgpt/android-no-missed-orders
    paths:
      - "readyproof/tools/apply_no_missed_patch.py"
      - ".github/workflows/apply-readyproof-no-missed.yml"
      - "readyproof/app/src/main/java/io/github/panuwattegif/readyproof/ProofService.kt"
      - "readyproof/app/src/main/java/io/github/panuwattegif/readyproof/CaptureManager.kt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/android-no-missed-orders
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply source patch
        run: python readyproof/tools/apply_no_missed_patch.py
      - name: Unit tests
        working-directory: readyproof
        run: ./gradlew --no-daemon :core:test
      - name: Build release
        working-directory: readyproof
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Commit patched sources
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add readyproof/app/src/main/java/io/github/panuwattegif/readyproof/ProofService.kt readyproof/app/src/main/java/io/github/panuwattegif/readyproof/CaptureManager.kt
          git commit -m "Make ReadyProof capture every order fail-closed"
          git push origin HEAD:chatgpt/android-no-missed-orders
