name: ReadyProof V2 and installable rollback
on:
  pull_request:
    paths: [ "readyproof-v2/**", ".github/workflows/readyproof-v2.yml" ]
  push:
    branches: [ "readyproof-v2" ]
    paths: [ "readyproof-v2/**", ".github/workflows/readyproof-v2.yml" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 76269cc04caee9388bc5c64c70dc09f517ecb082
          path: legacy-86
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test new logic and build signed update
        env:
          READYPROOF_SEQUENCE: ${{ github.run_number }}
        run: |
          cd readyproof-v2
          ../readyproof/gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
      - name: Build the user's chosen 1.0.86 code as a higher rollback
        env:
          READYPROOF_SEQUENCE: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("legacy-86/readyproof/app/build.gradle.kts")
          s=p.read_text()
          old="versionCode = 100 + buildNumber"
          assert s.count(old)==1
          s=s.replace(old,"versionCode = 100001 + " + str(int(__import__('os').environ['READYPROOF_SEQUENCE'])) + " * 2")
          p.write_text(s)
          PY
          cd legacy-86/readyproof
          ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
      - name: Verify package IDs, signer, and increasing install numbers
        run: |
          mkdir -p dist
          cp readyproof-v2/app/build/outputs/apk/release/app-release.apk dist/ReadyProof-V2.apk
          cp legacy-86/readyproof/app/build/outputs/apk/release/app-release.apk dist/ReadyProof-86-rollback.apk
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          for f in dist/*.apk; do "$SIGNER" verify --print-certs "$f"; "$AAPT" dump badging "$f" | head -1; done
          NEW=$( "$AAPT" dump badging dist/ReadyProof-V2.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1 )
          OLD=$( "$AAPT" dump badging dist/ReadyProof-86-rollback.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1 )
          test "$OLD" -gt "$NEW"
          test "$( "$SIGNER" verify --print-certs dist/ReadyProof-V2.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1 )" = "$( "$SIGNER" verify --print-certs dist/ReadyProof-86-rollback.apk | grep 'Signer #1 certificate SHA-256 digest:' | head -1 )"
          sha256sum dist/*.apk > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ReadyProof-V2-plus-installable-86-rollback
          path: dist/
