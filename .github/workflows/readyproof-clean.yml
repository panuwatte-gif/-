name: ReadyProof Clean Android

on:
  push:
    paths:
      - "readyproof-clean/**"
      - ".github/workflows/readyproof-clean.yml"
  pull_request:
    paths:
      - "readyproof-clean/**"
      - ".github/workflows/readyproof-clean.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readyproof-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle
        run: |
          cd readyproof-clean
          ../readyproof/gradlew --no-daemon -p . --version

      - name: Unit tests
        run: |
          cd readyproof-clean
          ../readyproof/gradlew --no-daemon -p . :core:test :app:testDebugUnitTest

      - name: Build APK
        run: |
          cd readyproof-clean
          ../readyproof/gradlew --no-daemon -p . :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p readyproof-clean/dist
          cp readyproof-clean/app/build/outputs/apk/release/app-release.apk readyproof-clean/dist/ReadyProofClean.apk
          sha256sum readyproof-clean/dist/ReadyProofClean.apk | tee readyproof-clean/dist/ReadyProofClean.apk.sha256
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs readyproof-clean/dist/ReadyProofClean.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyProofClean-apk
          path: readyproof-clean/dist/

      - name: Publish ReadyProof Clean release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          TAG="readyproof-clean-v${VERSION}"
          gh release create "$TAG" readyproof-clean/dist/ReadyProofClean.apk readyproof-clean/dist/ReadyProofClean.apk.sha256             --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"             --title "ReadyProof Clean ${VERSION}"             --notes "Separate clean-room app. Installs beside ReadyProof; no Drive automation. READY coverage, selected-date History sweep, local evidence and manual sharing."
          if gh release view readyproof-clean-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload readyproof-clean-latest readyproof-clean/dist/ReadyProofClean.apk readyproof-clean/dist/ReadyProofClean.apk.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/readyproof-clean-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit readyproof-clean-latest --repo "$GITHUB_REPOSITORY" --title "ReadyProof Clean ${VERSION} (ล่าสุด)" --notes "ติดตั้งคู่กับ ReadyProof เดิมได้ ข้อมูลเดิมไม่ถูกแตะ" --latest
          else
            gh release create readyproof-clean-latest readyproof-clean/dist/ReadyProofClean.apk readyproof-clean/dist/ReadyProofClean.apk.sha256               --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ReadyProof Clean ${VERSION} (ล่าสุด)"               --notes "ติดตั้งคู่กับ ReadyProof เดิมได้ ข้อมูลเดิมไม่ถูกแตะ" --latest
          fi
