name: ReadyProof Android

on:
  push:
    paths:
      - "readyproof/**"
      - ".github/workflows/readyproof-android.yml"
  pull_request:
    paths:
      - "readyproof/**"
      - ".github/workflows/readyproof-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readyproof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: readyproof
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle
        run: |
          for i in 1 2 3 4; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          exit 1

      - name: Unit tests (screen + report logic)
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ReadyProof.apk
          sha256sum dist/ReadyProof.apk | tee dist/ReadyProof.apk.sha256
          keytool -list -v -storetype PKCS12 -keystore keystore/readyproof.p12 -storepass readyproof -alias readyproof > dist/signing-certificate.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyProof-apk
          path: readyproof/dist/

      - name: Publish release "readyproof-latest"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          gh release create "readyproof-v${VERSION}" dist/ReadyProof.apk dist/ReadyProof.apk.sha256 dist/signing-certificate.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReadyProof ${VERSION}" \
            --notes "Local-first READY/History proof, daily summary and optional shop-bound Google Drive upload. OAuth console setup and first consent required; live device verification still required. See readyproof/END_TO_END.md. Build ${GITHUB_RUN_NUMBER} @ ${GITHUB_SHA}." \
            --latest
          if gh release view readyproof-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload readyproof-latest dist/ReadyProof.apk dist/ReadyProof.apk.sha256 dist/signing-certificate.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/readyproof-latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit readyproof-latest --repo "$GITHUB_REPOSITORY" --title "ReadyProof ${VERSION} (ล่าสุด)" --notes "ดาวน์โหลด APK แล้วติดตั้งทับได้ · OAuth และการอนุญาต Google ครั้งแรกยังจำเป็น · อ่าน readyproof/END_TO_END.md · build ${GITHUB_RUN_NUMBER} @ ${GITHUB_SHA}" --latest
          else
            gh release create readyproof-latest dist/ReadyProof.apk dist/ReadyProof.apk.sha256 dist/signing-certificate.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ReadyProof ${VERSION} (ล่าสุด)" --notes "See readyproof/END_TO_END.md for Google OAuth setup and device limitations." --latest
          fi
