name: ReadyProof Android

# Builds the ReadyProof APK on every change under readyproof/ and publishes it as the
# release "readyproof-latest", so the download link never changes:
# https://github.com/<owner>/<repo>/releases/download/readyproof-latest/ReadyProof.apk
on:
  push:
    paths:
      - "readyproof/**"
      - ".github/workflows/readyproof-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readyproof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: readyproof
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (screen + report logic)
        run: ./gradlew --no-daemon --stacktrace :core:test

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ReadyProof.apk
          sha256sum dist/ReadyProof.apk | tee dist/ReadyProof.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyProof-apk
          path: readyproof/dist/

      - name: Publish release "readyproof-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          gh release delete readyproof-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          sleep 3
          gh release create readyproof-latest dist/ReadyProof.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ReadyProof ${VERSION} (ล่าสุด)" \
            --notes "ดาวน์โหลด ReadyProof.apk ด้านล่าง แล้วติดตั้งทับของเดิมได้เลย (การตั้งค่าและภาพเดิมไม่หาย) · build ${GITHUB_RUN_NUMBER} · ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}" \
            --latest
