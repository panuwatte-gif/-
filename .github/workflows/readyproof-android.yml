name: ReadyProof Android

on:
  push:
    paths:
      - "readyproof/**"
      - ".github/workflows/readyproof-android.yml"
  pull_request:
    paths:
      - "readyproof/**"
      - ".github/workflows/readyproof-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readyproof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: readyproof
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Download Gradle
        run: |
          for i in 1 2 3 4; do
            ./gradlew --no-daemon --version && exit 0
            echo "Gradle download failed (attempt $i), retrying..."
            sleep $((i * 15))
          done
          exit 1

      - name: Unit tests (screen + report logic)
        run: ./gradlew --no-daemon --stacktrace :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ReadyProof.apk
          sha256sum dist/ReadyProof.apk | tee dist/ReadyProof.apk.sha256
          keytool -list -v -storetype PKCS12 -keystore keystore/readyproof.p12 -storepass readyproof -alias readyproof > dist/signing-certificate.txt
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs dist/ReadyProof.apk | tee dist/apk-signature.txt
          curl --fail --location --retry 3 "https://github.com/panuwatte-gif/-/releases/download/readyproof-v1.0.86/ReadyProof.apk" --output /tmp/ReadyProof-original-v7.apk
          echo "c2b9a57b76bb7e0192010d6b580c432b147404989de1d2b87ee5d017dd8ef5f9  /tmp/ReadyProof-original-v7.apk" | sha256sum --check -
          "$SIGNER" verify --print-certs /tmp/ReadyProof-original-v7.apk > /tmp/original-signature.txt
          diff <(grep '^Signer #1 certificate SHA-256 digest:' /tmp/original-signature.txt) <(grep '^Signer #1 certificate SHA-256 digest:' dist/apk-signature.txt)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging dist/ReadyProof.apk > dist/package-version.txt
          "$AAPT" dump badging /tmp/ReadyProof-original-v7.apk > /tmp/original-package.txt
          python3 - <<'PY'
          import re
          new=open("dist/package-version.txt").read()
          old=open("/tmp/original-package.txt").read()
          package=lambda s: re.search(r"name='([^']+)'", s).group(1)
          version=lambda s: int(re.search(r"versionCode='(\d+)'", s).group(1))
          assert package(new)==package(old)=="io.github.panuwattegif.readyproof"
          assert version(new)>227, "Recovery must install over ReadyProof 1.0.127"
          assert version(old)==186
          print("Same package and signer; recovery versionCode exceeds 1.0.127")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ReadyProof-apk
          path: readyproof/dist/

      - name: Publish original-v7 recovery APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/original-v7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="readyproof-recovery-v7-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/ReadyProof.apk dist/ReadyProof.apk.sha256 dist/signing-certificate.txt dist/apk-signature.txt dist/package-version.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "ReadyProof original v7 recovery (build ${GITHUB_RUN_NUMBER})" \
            --notes "Recovery of the exact application source from 1.0.86, identified by SHA256 of the supplied ReadyProof (7).apk. Application logic unchanged; a higher install version and the original signing key allow updating over 1.0.127 without uninstall. Existing records/photos retained. Original behavior and its limitations are retained. Verified package/signature/version in CI; OPPO installation is not physically verified. This release does not replace readyproof-latest." \
            --latest=false
